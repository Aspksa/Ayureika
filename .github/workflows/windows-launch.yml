name: Windows launcher checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile frontend
        run: npm run build
      - name: Run startup tests
        run: python -m unittest discover -s tests -v
      - name: Verify BAT from special-character path
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'Ayureika тест & (x)'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE '*') -Destination $target -Recurse -Force
          $script = Join-Path $target 'Ayureika.bat'
          if (-not (Test-Path -LiteralPath $script)) { throw 'BAT not copied' }
          $env:AYUREIKA_CI_CHECK = '1'
          & cmd.exe /d /c ('"' + $script + '"')
          if ($LASTEXITCODE -ne 0) { throw "BAT failed: $LASTEXITCODE" }
