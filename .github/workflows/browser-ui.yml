name: Browser UI smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  browser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: node tests/browser-smoke.cjs
